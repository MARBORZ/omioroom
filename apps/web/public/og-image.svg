<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#101012" />
  
  <!-- Subtle room viewport outline -->
  <rect x="80" y="60" width="1040" height="510" rx="24" stroke="#222226" stroke-width="2" fill="#141417" />

  <!-- Centered Logo Brand Mark -->
  <g transform="translate(520, 150) scale(2.4)">
    <circle cx="22" cy="32" r="14" stroke="#F4F0E8" stroke-width="6" fill="none" />
    <circle cx="42" cy="32" r="14" stroke="#FF6847" stroke-width="6" fill="none" />
  </g>

  <!-- Typography -->
  <text x="600" y="380" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="0.03em">
    <tspan fill="#F4F0E8">OMIO</tspan><tspan fill="#FF6847">ROOM</tspan>
  </text>
  
  <text x="600" y="440" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#A0A0A8">
    Смотрите видео вместе с друзьями. Синхронно, с чатом и голосом.
  </text>
  
  <text x="600" y="490" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#666670">
    YouTube • VK Видео • RuTube • Vimeo • MP4 / HLS
  </text>
</svg>
