<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMIOROOM — watch together</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="Смотрите видео вместе с друзьями. Синхронный плеер, чат, голос." />
    <meta property="og:title" content="OMIOROOM — watch together" />
    <meta property="og:description" content="Смотрите видео вместе с друзьями. Синхронный плеер, чат, голос." />
    <meta property="og:image" content="/og-image.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('omioroom_theme') || 'system';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          var density = localStorage.getItem('omioroom_density') || 'default';
          document.documentElement.setAttribute('data-density', density);
          var motion = localStorage.getItem('omioroom_reduced_motion') || 'system';
          if (motion === 'reduce' || (motion === 'system' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            document.documentElement.setAttribute('data-reduced-motion', 'reduce');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
